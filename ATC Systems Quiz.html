<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATC Systems Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F0;
    --panel: #FFFFFF;
    --panel-2: #F5F7F6;
    --border: #D6DDDA;
    --text: #14201C;
    --muted: #5B6B65;
    --accent: #B4750F;
    --accent-soft: #F3E2C4;
    --good: #2F7A52;
    --good-soft: #DCEFE3;
    --bad: #A3402F;
    --bad-soft: #F6DEDA;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20,32,28,0.06), 0 6px 20px rgba(20,32,28,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151A;
      --panel: #171E24;
      --panel-2: #1D262D;
      --border: #2A343C;
      --text: #E7EDEB;
      --muted: #8CA098;
      --accent: #E0A840;
      --accent-soft: #3A311C;
      --good: #6FC298;
      --good-soft: #163024;
      --bad: #E28271;
      --bad-soft: #33201C;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151A;
    --panel: #171E24;
    --panel-2: #1D262D;
    --border: #2A343C;
    --text: #E7EDEB;
    --muted: #8CA098;
    --accent: #E0A840;
    --accent-soft: #3A311C;
    --good: #6FC298;
    --good-soft: #163024;
    --bad: #E28271;
    --bad-soft: #33201C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
    cursor: pointer;
  }
  header.top h1 {
    font-size: 19px;
    letter-spacing: 0.2px;
    margin: 0;
  }
  header.top .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 16px;
  }
  h2.section-title {
    font-size: 13px;
    text-transform: none;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 600;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .mode-tabs button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 6px;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .mode-tabs button.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .section-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .section-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    background: var(--panel-2);
  }
  .section-row.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .section-row .name { font-size: 14px; font-weight: 500; }
  .section-row .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .radio-dot, .check-box {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid var(--muted);
    flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .check-box { border-radius: 4px; }
  .section-row.selected .radio-dot, .section-row.selected .check-box { border-color: var(--accent); }
  .section-row.selected .radio-dot::after {
    content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .section-row.selected .check-box::after {
    content: '✓'; font-size: 11px; color: var(--accent); font-weight: 700;
  }
  .row-flex { display: flex; align-items: center; gap: 10px; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 2px;
    font-size: 14px;
  }
  .toggle-row + .toggle-row { border-top: 1px solid var(--border); }
  .switch {
    width: 38px; height: 22px; border-radius: 20px;
    background: var(--border);
    position: relative; cursor: pointer; flex-shrink: 0;
    transition: background 0.15s;
  }
  .switch.on { background: var(--accent); }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%; background: var(--panel);
    transition: transform 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .switch.on::after { transform: translateX(16px); }
  .pool-line {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    margin: 10px 0 14px;
  }
  button.primary {
    width: 100%;
    background: var(--accent);
    color: #1A1204;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost {
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 11px;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .history-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .label { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .history-item .score { font-weight: 700; }
  .history-item .trend { font-family: var(--mono); margin-left: 6px; }
  .trend.up { color: var(--good); }
  .trend.down { color: var(--bad); }
  .trend.flat { color: var(--muted); }
  .best-line { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .empty-note { font-size: 13px; color: var(--muted); }

  /* Quiz screen */
  .progress-bar {
    position: sticky; top: env(safe-area-inset-top, 0px);
    height: 5px; background: var(--border);
    border-radius: 3px; overflow: hidden; z-index: 5; margin-bottom: 16px;
  }
  .progress-bar > div { height: 100%; background: var(--accent); transition: width 0.2s; }
  .quiz-meta {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    margin-bottom: 16px;
  }
  .quiz-meta .timer { color: var(--text); font-weight: 600; }
  .quiz-meta .timer.low { color: var(--bad); }
  .q-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px;
    scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 48px);
  }
  .q-card.active { border-color: var(--accent); }
  .q-num { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .q-text { font-size: 15px; line-height: 1.45; margin-bottom: 12px; }
  .opt {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 11px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 7px; cursor: pointer; font-size: 14px; line-height: 1.4;
    background: var(--panel-2);
  }
  .opt .letter {
    font-family: var(--mono); font-weight: 700; font-size: 12px;
    color: var(--muted); border: 1px solid var(--border); border-radius: 5px;
    width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .opt.selected .letter { border-color: var(--accent); color: var(--accent); }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.correct .letter { border-color: var(--good); color: var(--good); }
  .opt.incorrect { border-color: var(--bad); background: var(--bad-soft); }
  .opt.incorrect .letter { border-color: var(--bad); color: var(--bad); }
  .submit-bar {
    position: sticky; bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg); padding: 12px 0 4px; margin-top: 6px;
  }
  .submit-bar .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* Results */
  .score-hero { text-align: center; padding: 10px 0 18px; }
  .score-hero .big { font-family: var(--mono); font-size: 44px; font-weight: 700; }
  .score-hero .pass { color: var(--good); }
  .score-hero .fail { color: var(--bad); }
  .score-hero .verdict { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .breakdown-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; font-size: 13.5px; border-bottom: 1px solid var(--border);
  }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-row .bfrac { font-family: var(--mono); color: var(--muted); }
  .results-actions { display: flex; gap: 8px; margin-top: 4px; }
  .results-actions button { flex: 1; }

  kbd {
    font-family: var(--mono); font-size: 11px; border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; background: var(--panel-2);
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal {
    background: var(--panel); border-radius: var(--radius); padding: 20px;
    max-width: 340px; width: 100%; box-shadow: var(--shadow);
  }
  .modal p { font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
  .modal .actions { display: flex; gap: 8px; }
  .hidden { display: none !important; }
</style>
</head>

  { section: "Navigation", question: "Which ground-based navigation systems are used in the different phases of flight:", options: ["EnRoute (VOR, DME, NDB) Terminal (NDB, ILS, VOR, DME)", "EnRoute (VOR, ILS) Terminal (NDB, DME)", "EnRoute (VOR, DME, ILS) Terminal (NDB, VOR, DME)"], correct: 0 },

  { section: "Surveillance", question: "Which of the following is false with respect to primary radar?", options: ["Requires high power", "Has a wide range", "Friend or foe identification is possible"], correct: 2 },
  { section: "Surveillance", question: "What type of radar is the primary radar?", options: ["Pulse", "Continuous wave", "Low frequency"], correct: 0 },
  { section: "Surveillance", question: "What is the full form of RADAR?", options: ["Radio and ranging", "Range detection radio", "Radio Detection and Ranging"], correct: 2 },
  { section: "Surveillance", question: "Which of the following is false with respect to secondary radar?", options: ["Requires more power than primary radar", "Needs a transponder device on the aircraft", "IFF"], correct: 0 },
  { section: "Surveillance", question: "What is the reflected pulse in primary radar called?", options: ["Reply", "Radio reply", "Echo"], correct: 2 },
  { section: "Surveillance", question: "A 'radome' is a", options: ["protective cover for the antenna", "radar housed in a dome", "dome-shaped radar antenna"], correct: 0 },

  { section: "Human Factors", question: "Fill in the missing word in the following ICAO definition of human factors, by selecting from the list:", options: ["People", "Equipment", "Procedures"], correct: 0 },
  { section: "Human Factors", question: "Select the right type of error to fill in the missing word in the following definition: occur where actions deviate from safe procedures standards or rules, be they deliberate or erroneous", options: ["Slips", "Mistakes", "Violations"], correct: 2 },
  { section: "Human Factors", question: "In the SHELL Model, H stands for:", options: ["Human", "Hardware", "Harmonised Procedures"], correct: 0 }
];
/* ============================================================ */

const PASS_MARK = 80;
const TIMER_SECONDS_PER_Q = 90;
const FINAL_EXAM_SIZE = 50;
const MIN_PER_SECTION = 3;
const HISTORY_KEY = "mcq_quiz_history_v1";
const HISTORY_MAX = 5;

const sections = [...new Set(QUESTIONS.map(q => q.section))];
const app = document.getElementById("app");

let state = {
  screen: "home",           // home | quiz | results
  mode: "module",           // module | final | custom
  selectedSection: sections[0] || null,
  selectedCustom: new Set(),
  instantFeedback: true,
  timerOn: false,
  quiz: null,               // { questions: [...], mode, poolLabel }
  answers: {},               // qIndex -> optionIndex
  locked: {},                 // qIndex -> true once answered w/ instant feedback
  submitted: false,
  timeLeft: 0,
  timerHandle: null,
  activeIndex: 0,
  confirmSwitch: null
};

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuestionInstance(q){
  const optOrder = shuffle(q.options.map((opt,i)=>({opt,i})));
  const newCorrect = optOrder.findIndex(o => o.i === q.correct);
  return { section: q.section, question: q.question, options: optOrder.map(o=>o.opt), correct: newCorrect };
}

function poolForSelection(){
  if(state.mode === "module"){
    return QUESTIONS.filter(q => q.section === state.selectedSection);
  }
  if(state.mode === "custom"){
    if(state.selectedCustom.size === 0) return [];
    return QUESTIONS.filter(q => state.selectedCustom.has(q.section));
  }
  return QUESTIONS; // final
}

function buildFinalExam(){
  const bySection = {};
  sections.forEach(s => bySection[s] = shuffle(QUESTIONS.filter(q=>q.section===s)));
  let picked = [];
  sections.forEach(s => { picked = picked.concat(bySection[s].slice(0, MIN_PER_SECTION)); });
  const used = new Set(picked);
  const remaining = shuffle(QUESTIONS.filter(q => !used.has(q)));
  let i = 0;
  while(picked.length < FINAL_EXAM_SIZE && i < remaining.length){
    picked.push(remaining[i]); i++;
  }
  return shuffle(picked).slice(0, Math.min(FINAL_EXAM_SIZE, picked.length));
}

function startQuiz(){
  let pool;
  let label;
  if(state.mode === "module"){
    pool = poolForSelection();
    label = state.selectedSection;
  } else if(state.mode === "custom"){
    pool = poolForSelection();
    label = "Custom (" + state.selectedCustom.size + " section" + (state.selectedCustom.size===1?"":"s") + ")";
  } else {
    pool = buildFinalExam();
    label = "Final Exam";
  }
  if(!pool || pool.length === 0) return;
  const instances = shuffle(pool).map(buildQuestionInstance);
  state.quiz = { questions: instances, mode: state.mode, poolLabel: label };
  state.answers = {};
  state.locked = {};
  state.submitted = false;
  state.activeIndex = 0;
  state.screen = "quiz";
  if(state.timerOn){
    state.timeLeft = instances.length * TIMER_SECONDS_PER_Q;
    startTimer();
  }
  render();
  setTimeout(()=> setupObserver(), 50);
}

function startTimer(){
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(()=>{
    state.timeLeft--;
    updateTimerDisplay();
    if(state.timeLeft <= 0){
      clearInterval(state.timerHandle);
      submitQuiz();
    }
  }, 1000);
}

function updateTimerDisplay(){
  const el = document.getElementById("timerDisplay");
  if(!el) return;
  const m = Math.floor(state.timeLeft/60);
  const s = state.timeLeft%60;
  el.textContent = m + ":" + String(s).padStart(2,"0");
  el.classList.toggle("low", state.timeLeft <= 30);
}

function selectAnswer(qIndex, optIndex){
  if(state.submitted) return;
  if(state.instantFeedback && state.locked[qIndex] !== undefined) return;
  state.answers[qIndex] = optIndex;
  if(state.instantFeedback){
    state.locked[qIndex] = true;
  }
  render();
  setTimeout(()=> setupObserver(), 30);
}

function unansweredCount(){
  return state.quiz.questions.length - Object.keys(state.answers).length;
}

function submitQuiz(force){
  if(!force && unansweredCount() > 0){
    state.confirmSwitch = "submit-blank";
    render();
    return;
  }
  clearInterval(state.timerHandle);
  state.submitted = true;
  state.screen = "results";
  saveAttempt();
  render();
  window.scrollTo(0,0);
}

function scoreQuiz(){
  const qs = state.quiz.questions;
  let correct = 0;
  const bySection = {};
  qs.forEach((q,i)=>{
    if(!bySection[q.section]) bySection[q.section] = {correct:0, total:0};
    bySection[q.section].total++;
    if(state.answers[i] === q.correct){ correct++; bySection[q.section].correct++; }
  });
  const pct = Math.round((correct / qs.length) * 100);
  return { correct, total: qs.length, pct, bySection };
}

function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}

function saveAttempt(){
  const { pct } = scoreQuiz();
  const entry = { date: new Date().toISOString(), mode: state.quiz.mode, label: state.quiz.poolLabel, pct };
  try{
    let hist = loadHistory();
    hist.unshift(entry);
    hist = hist.slice(0, HISTORY_MAX);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  }catch(e){ /* storage unavailable — continue without saving */ }
}

function resetHistory(){
  try{ localStorage.removeItem(HISTORY_KEY); }catch(e){}
  render();
}

function retryQuiz(){
  const pool = state.quiz.questions.map(q => ({ section: q.section, question: q.question, options: q.options, correct: q.correct }));
  // reshuffle option order fresh
  const base = pool.map(q => {
    const original = QUESTIONS.find(o => o.question === q.question) || q;
    return original;
  });
  const instances = shuffle(base).map(buildQuestionInstance);
  state.quiz.questions = instances;
  state.answers = {};
  state.locked = {};
  state.submitted = false;
  state.activeIndex = 0;
  state.screen = "quiz";
  if(state.timerOn){ state.timeLeft = instances.length * TIMER_SECONDS_PER_Q; startTimer(); }
  render();
  setTimeout(()=> setupObserver(), 50);
}

function retakeIncorrect(){
  const qs = state.quiz.questions;
  const wrongOriginals = [];
  qs.forEach((q,i)=>{
    if(state.answers[i] !== q.correct){
      const original = QUESTIONS.find(o => o.question === q.question);
      if(original) wrongOriginals.push(original);
    }
  });
  if(wrongOriginals.length === 0) return;
  const instances = shuffle(wrongOriginals).map(buildQuestionInstance);
  state.quiz = { questions: instances, mode: state.quiz.mode, poolLabel: state.quiz.poolLabel + " · incorrect" };
  state.answers = {};
  state.locked = {};
  state.submitted = false;
  state.activeIndex = 0;
  state.screen = "quiz";
  if(state.timerOn){ state.timeLeft = instances.length * TIMER_SECONDS_PER_Q; startTimer(); }
  render();
  setTimeout(()=> setupObserver(), 50);
}

function goHome(force){
  if(state.screen === "quiz" && !force){
    state.confirmSwitch = "leave-quiz";
    render();
    return;
  }
  clearInterval(state.timerHandle);
  state.screen = "home";
  state.quiz = null;
  render();
}

let observer = null;
function setupObserver(){
  if(observer) observer.disconnect();
  const cards = document.querySelectorAll(".q-card");
  if(!cards.length) return;
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const idx = parseInt(e.target.dataset.qindex,10);
        state.activeIndex = idx;
      }
    });
  }, { threshold: 0.6 });
  cards.forEach(c => observer.observe(c));
}

document.addEventListener("keydown", (e)=>{
  if(state.screen !== "quiz" || state.submitted) return;
  const key = e.key.toLowerCase();
  if(["a","b","c"].includes(key)){
    const letterIndex = {a:0,b:1,c:2}[key];
    const q = state.quiz.questions[state.activeIndex];
    if(q && letterIndex < q.options.length){
      selectAnswer(state.activeIndex, letterIndex);
    }
  } else if(e.key === "Enter"){
    submitQuiz(false);
  }
});

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}

function render(){
  if(state.screen === "home") return renderHome();
  if(state.screen === "quiz") return renderQuiz();
  if(state.screen === "results") return renderResults();
}

function renderHome(){
  const hist = loadHistory();
  const best = hist.length ? Math.max(...hist.map(h=>h.pct)) : null;

  let poolCount = poolForSelection().length;
  let startEnabled = poolCount > 0;
  if(state.mode === "final") { poolCount = QUESTIONS.length; startEnabled = QUESTIONS.length > 0; }

  const modeTabs = `
    <div class="mode-tabs">
      <button data-mode="module" class="${state.mode==='module'?'active':''}">Module</button>
      <button data-mode="final" class="${state.mode==='final'?'active':''}">Final Exam</button>
      <button data-mode="custom" class="${state.mode==='custom'?'active':''}">Custom</button>
    </div>`;

  let modeBody = "";
  if(state.mode === "module"){
    modeBody = `<h2 class="section-title">Pick a section</h2><div class="section-list">` +
      sections.map(s => {
        const count = QUESTIONS.filter(q=>q.section===s).length;
        return `<div class="section-row ${s===state.selectedSection?'selected':''}" data-section="${s}">
          <div class="row-flex"><span class="radio-dot"></span><span class="name">${s}</span></div>
          <span class="count">${count} Q</span>
        </div>`;
      }).join("") + `</div>`;
  } else if(state.mode === "custom"){
    modeBody = `<h2 class="section-title">Select sections to mix</h2><div class="section-list">` +
      sections.map(s => {
        const count = QUESTIONS.filter(q=>q.section===s).length;
        const sel = state.selectedCustom.has(s);
        return `<div class="section-row ${sel?'selected':''}" data-customsection="${s}">
          <div class="row-flex"><span class="check-box"></span><span class="name">${s}</span></div>
          <span class="count">${count} Q</span>
        </div>`;
      }).join("") + `</div>`;
  } else {
    modeBody = `<p class="pool-line">${FINAL_EXAM_SIZE} questions drawn from all sections. Every section is guaranteed at least ${MIN_PER_SECTION}.</p>`;
  }

  app.innerHTML = `
    <header class="top" id="titleHome">
      <h1>MCQ Quiz Generator</h1>
      <span class="tag">${QUESTIONS.length} questions loaded</span>
    </header>

    <div class="panel">
      ${modeTabs}
      ${modeBody}
      <p class="pool-line">Questions in pool: ${poolCount}</p>

      <div class="toggle-row">
        <span>Instant feedback</span>
        <div class="switch ${state.instantFeedback?'on':''}" id="toggleFeedback"></div>
      </div>
      <div class="toggle-row">
        <span>Timer (1.5 min / question)</span>
        <div class="switch ${state.timerOn?'on':''}" id="toggleTimer"></div>
      </div>

      <button class="primary" id="startBtn" ${startEnabled?'':'disabled'} style="margin-top:14px">Start Quiz</button>
    </div>

    <div class="panel">
      <h2 class="section-title">Previous Attempts</h2>
      ${hist.length ? `<p class="best-line">All-time best: <strong>${best}%</strong></p>` : ''}
      ${hist.length === 0 ? '<p class="empty-note">No attempts yet.</p>' :
        hist.map((h,i)=>{
          const prev = hist[i+1];
          let trendCls = "flat", trendChar = "→";
          if(prev){
            if(h.pct > prev.pct){ trendCls="up"; trendChar="↑"; }
            else if(h.pct < prev.pct){ trendCls="down"; trendChar="↓"; }
          }
          return `<div class="history-item">
            <span class="label">${fmtDate(h.date)} · ${h.label}</span>
            <span><span class="score">${h.pct}%</span><span class="trend ${trendCls}">${trendChar}</span></span>
          </div>`;
        }).join("")
      }
      ${hist.length ? `<button class="ghost" id="resetHistBtn">Reset History</button>` : ''}
    </div>
  `;

  document.getElementById("titleHome").onclick = ()=>{};
  document.querySelectorAll("[data-mode]").forEach(b=>{
    b.onclick = ()=>{ state.mode = b.dataset.mode; render(); };
  });
  document.querySelectorAll("[data-section]").forEach(b=>{
    b.onclick = ()=>{ state.selectedSection = b.dataset.section; render(); };
  });
  document.querySelectorAll("[data-customsection]").forEach(b=>{
    b.onclick = ()=>{
      const s = b.dataset.customsection;
      if(state.selectedCustom.has(s)) state.selectedCustom.delete(s);
      else state.selectedCustom.add(s);
      render();
    };
  });
  const fb = document.getElementById("toggleFeedback");
  if(fb) fb.onclick = ()=>{ state.instantFeedback = !state.instantFeedback; render(); };
  const tm = document.getElementById("toggleTimer");
  if(tm) tm.onclick = ()=>{ state.timerOn = !state.timerOn; render(); };
  const startBtn = document.getElementById("startBtn");
  if(startBtn) startBtn.onclick = startQuiz;
  const resetBtn = document.getElementById("resetHistBtn");
  if(resetBtn) resetBtn.onclick = resetHistory;
}

function renderQuiz(){
  const qs = state.quiz.questions;
  const answeredCount = Object.keys(state.answers).length;
  const pct = Math.round((answeredCount / qs.length) * 100);

  const cardsHtml = qs.map((q,i)=>{
    const letters = ["A","B","C"];
    const userAns = state.answers[i];
    const locked = state.instantFeedback && state.locked[i] !== undefined;
    const optsHtml = q.options.map((opt,oi)=>{
      let cls = "opt";
      if(locked){
        if(oi === q.correct) cls += " correct";
        else if(oi === userAns) cls += " incorrect";
      } else if(userAns === oi){
        cls += " selected";
      }
      return `<div class="${cls}" data-qi="${i}" data-oi="${oi}">
        <span class="letter">${letters[oi]}</span><span>${opt}</span>
      </div>`;
    }).join("");
    return `<div class="q-card" data-qindex="${i}">
      <div class="q-num">Question ${i+1} of ${qs.length} · ${q.section}</div>
      <div class="q-text">${q.question}</div>
      ${optsHtml}
    </div>`;
  }).join("");

  app.innerHTML = `
    <header class="top" id="titleQuiz" style="cursor:pointer">
      <h1>MCQ Quiz Generator</h1>
      <span class="tag">${state.quiz.poolLabel}</span>
    </header>
    <div class="progress-bar"><div style="width:${pct}%"></div></div>
    <div class="quiz-meta">
      <span>${answeredCount} / ${qs.length} answered</span>
      ${state.timerOn ? `<span class="timer" id="timerDisplay">--:--</span>` : ''}
    </div>
    ${cardsHtml}
    <div class="submit-bar">
      <button class="primary" id="submitBtn">Submit</button>
      <p class="hint">Press <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> to answer · <kbd>Enter</kbd> to submit</p>
    </div>
    ${state.confirmSwitch ? renderConfirmModal() : ''}
  `;

  document.getElementById("titleQuiz").onclick = ()=> goHome(false);
  document.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=> selectAnswer(parseInt(el.dataset.qi,10), parseInt(el.dataset.oi,10));
  });
  document.getElementById("submitBtn").onclick = ()=> submitQuiz(false);
  if(state.timerOn) updateTimerDisplay();
  bindModal();
}

function renderConfirmModal(){
  if(state.confirmSwitch === "submit-blank"){
    return `<div class="modal-backdrop"><div class="modal">
      <p>You've left ${unansweredCount()} question${unansweredCount()===1?'':'s'} blank. Blank answers count as incorrect. Submit anyway?</p>
      <div class="actions">
        <button class="ghost" id="modalCancel" style="margin-top:0">Cancel</button>
        <button class="primary" id="modalConfirm">Submit anyway</button>
      </div>
    </div></div>`;
  }
  if(state.confirmSwitch === "leave-quiz"){
    return `<div class="modal-backdrop"><div class="modal">
      <p>A quiz is in progress. Leaving now will discard your current answers. Continue?</p>
      <div class="actions">
        <button class="ghost" id="modalCancel" style="margin-top:0">Stay</button>
        <button class="primary" id="modalConfirm">Leave quiz</button>
      </div>
    </div></div>`;
  }
  return "";
}

function bindModal(){
  const cancel = document.getElementById("modalCancel");
  const confirm = document.getElementById("modalConfirm");
  if(cancel) cancel.onclick = ()=>{ state.confirmSwitch = null; render(); };
  if(confirm) confirm.onclick = ()=>{
    const type = state.confirmSwitch;
    state.confirmSwitch = null;
    if(type === "submit-blank") submitQuiz(true);
    if(type === "leave-quiz") goHome(true);
  };
}

function renderResults(){
  const { correct, total, pct, bySection } = scoreQuiz();
  const passed = pct >= PASS_MARK;
  const hasIncorrect = correct < total;

  app.innerHTML = `
    <header class="top" id="titleResults" style="cursor:pointer">
      <h1>MCQ Quiz Generator</h1>
      <span class="tag">${state.quiz.poolLabel}</span>
    </header>
    <div class="panel">
      <div class="score-hero">
        <div class="big ${passed?'pass':'fail'}">${pct}%</div>
        <div class="verdict">${correct} / ${total} correct · ${passed ? 'Pass' : 'Below pass mark'} (${PASS_MARK}% required)</div>
      </div>
      <h2 class="section-title">Section breakdown</h2>
      ${Object.keys(bySection).map(s=>{
        const b = bySection[s];
        const spct = Math.round((b.correct/b.total)*100);
        return `<div class="breakdown-row"><span>${s}</span><span class="bfrac">${b.correct}/${b.total} · ${spct}%</span></div>`;
      }).join("")}
      <div class="results-actions" style="margin-top:14px">
        <button class="ghost" id="retryBtn" style="margin-top:0">Retry</button>
        <button class="ghost" id="retakeBtn" style="margin-top:0" ${hasIncorrect?'':'disabled'}>Retake Incorrect</button>
      </div>
      <button class="primary" id="homeBtn" style="margin-top:10px">Back to Home</button>
    </div>
  `;
  document.getElementById("titleResults").onclick = ()=> goHome(true);
  document.getElementById("retryBtn").onclick = retryQuiz;
  document.getElementById("retakeBtn").onclick = retakeIncorrect;
  document.getElementById("homeBtn").onclick = ()=> goHome(true);
}

render();
})();
</script>
</body>
</html>
